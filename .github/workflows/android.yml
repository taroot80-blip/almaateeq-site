name: Android app

on:
  push:
    branches: [android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build test APK, release APK and bundle
        run: gradle -p android assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: almaateeq-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Commit outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/almaateeq.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/almaateeq-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/almaateeq-unsigned.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build Android app [skip ci]" || exit 0
          git push
