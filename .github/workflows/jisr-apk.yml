name: جسر العطاء — بناء APK
on:
  push:
    branches: [main]
    paths:
      - 'apps/jisr/**'
      - 'android/jisr/**'
      - '.github/workflows/jisr-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        working-directory: android/jisr
        run: |
          mkdir -p app/src/main/assets
          cp ../../apps/jisr/index.html ../../apps/jisr/hero.jpg ../../apps/jisr/manifest.json ../../apps/jisr/icon-192.png ../../apps/jisr/icon-512.png ../../apps/jisr/config.js ../../apps/jisr/privacy.html ../../apps/jisr/logo-96.png ../../apps/jisr/logo.webp app/src/main/assets/ && cp -r ../../apps/jisr/demo app/src/main/assets/
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/jisr-alataa.apk
      - uses: actions/upload-artifact@v4
        with: { name: jisr-alataa, path: out/ }
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jisr-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create jisr-latest out/jisr-alataa.apk --title "جسر العطاء — أحدث نسخة" \
            --notes "تطبيق أندرويد لمنصة جسر العطاء: يفتح نسخة الموقع مع الإنترنت فيظهر آخر تحديث دائمًا، والنسخة المدمجة بلا إنترنت." --latest=false
