<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24553f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>جسر المعاتيق</title>
<meta name="description" content="منصة لتدوير المقتنيات المنزلية الفائضة وإيصالها مباشرة لمن يحتاجها، حفظاً للنعمة وصوناً للكرامة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --g9:#173a2b; --g7:#24553f; --g5:#3a7a5c; --g2:#dcebe2; --g1:#eef5f0;
  --gold:#c8963e; --gold1:#f7ecd8;
  --ink:#1d2622; --mut:#66736c; --line:#e3e8e5; --bg:#f6f7f5; --card:#fff;
  --red:#b3412f; --red1:#f8e3df; --blue:#2c5f8a; --blue1:#e2edf6;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(23,58,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g7)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(135deg,var(--g9),var(--g7));color:#fff;padding:18px 0 22px}
header.top .wrap{display:flex;align-items:center;gap:14px}
.logo-tile{flex:none;background:#fff;border-radius:16px;padding:6px;height:84px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo-tile img{height:72px;width:auto;display:block}
.brand{flex:1;text-align:center;min-width:0}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:0}
.brand p{margin:0;font-size:13px;opacity:.85}
.who{margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.who button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
@media(max-width:520px){.logo-tile{height:62px;padding:4px;border-radius:12px}.logo-tile img{height:54px}.brand h1{font-size:20px}.brand p{font-size:11.5px}header.top .wrap{gap:8px}}
.banner{background:var(--gold1);color:#6b4b14;border-bottom:1px solid #ecd9b4;font-size:14px;padding:8px 0}
.trial{background:var(--blue1);color:var(--blue);font-size:13px;padding:6px 0;text-align:center}
main{padding:18px 0}
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:960px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:12px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--g7);font-weight:700}
h2.sec{font-size:20px;margin:4px 0 4px;font-weight:800}
p.sub{margin:0 0 16px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.item:hover{transform:translateY(-2px)}
.item .ph{aspect-ratio:4/3;background:var(--g1) center/cover no-repeat;display:grid;place-items:center;color:var(--g5);position:relative}
.item .ph>svg{width:52px;height:52px;opacity:.55}
.stamp{position:absolute;inset:0;margin:auto;width:72%;height:34%;display:grid;place-items:center;transform:rotate(-14deg);border:4px solid #fff;outline:3px solid #c62f25;border-radius:999px;background:rgba(198,47,37,.92);color:#fff;font-weight:800;font-size:clamp(18px,5vw,30px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wa{background:#1f9e57}.wa:hover{background:#167a42}
.prev{white-space:pre-wrap;background:#f1f7ee;border:1px solid #d6e8cf;border-radius:12px;padding:12px;font-size:14px;max-height:260px;overflow:auto}
textarea.prev{width:100%;min-height:220px;font-family:inherit}
.previmg{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:0 auto 10px}
.item .ph .tag{position:absolute;top:8px;inset-inline-start:8px}
.item .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-size:16px;font-weight:700;line-height:1.4}
.meta{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 10px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:2px;background:var(--g1);color:var(--g9);padding:2px 10px;border-radius:8px;font-size:15px;direction:ltr;display:inline-block}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--g1);color:var(--g7);font-weight:500}
.pill.gold{background:var(--gold1);color:#7a5514}.pill.red{background:var(--red1);color:var(--red)}.pill.blue{background:var(--blue1);color:var(--blue)}.pill.gray{background:#eef0ef;color:#555}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--g7);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--g9)}
.btn.sec{background:var(--g1);color:var(--g9)}.btn.sec:hover{background:var(--g2)}
.btn.gold{background:var(--gold);}.btn.red{background:var(--red1);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
label.f>small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;border:1px solid #cfd8d3;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g5);box-shadow:0 0 0 3px var(--g2)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{display:none}
.chips span{display:inline-block;border:1px solid #cfd8d3;border-radius:999px;padding:6px 12px;font-size:13px;background:#fff}
.chips input:checked+span{background:var(--g7);color:#fff;border-color:var(--g7)}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs div{width:82px;height:82px;border-radius:10px;background:center/cover;position:relative;border:1px solid var(--line)}
.thumbs b{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;cursor:pointer}
.pledge{background:var(--gold1);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:14px}
.pledge input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--g7)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty svg{width:56px;height:56px;color:var(--g2)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--g9);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--sh);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(10,25,18,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-4px 0 12px}
.gal img{height:240px;border-radius:12px;scroll-snap-align:start;object-fit:cover;max-width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{color:var(--mut);font-weight:500}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.subtabs button.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.list>.card{margin-bottom:10px}
.mini{width:64px;height:64px;border-radius:10px;background:var(--g1) center/cover;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--g9);line-height:1.2}
.kpi span{font-size:13px;color:var(--mut)}
.bars .r{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.bars .t{background:var(--g1);border-radius:6px;height:14px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--g5);border-radius:6px}
.hero{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .t{flex:1;min-width:220px}
.hero h2{margin:0 0 4px;font-size:18px}
.hero p{margin:0;color:var(--mut);font-size:14px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select,.filters input{width:auto;flex:1;min-width:140px}
.rules li{margin-bottom:8px}
.bigcode{font-size:34px;letter-spacing:8px;text-align:center;direction:ltr}
.ok{background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:14px;margin-top:14px}
.hide{display:none!important}
.spin{width:22px;height:22px;border:3px solid var(--g2);border-top-color:var(--g7);border-radius:50%;animation:s 0.8s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:520px){.two{grid-template-columns:1fr}.bars .r{grid-template-columns:110px 1fr 40px}.grid{grid-template-columns:1fr 1fr;gap:10px}.item h3{font-size:14px}.item .bd{padding:10px}}
@media print{
  nav.tabs,header.top .who,.noprint,.subtabs,.banner,.trial{display:none!important}
  body{background:#fff;padding:0}.card,.kpi{box-shadow:none}
  header.top{background:#fff;color:#000;border-bottom:2px solid var(--g7)}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo-tile" href="#today" id="logoR"><img id="logoRimg" src="logo.png" alt=""></a>
    <div class="brand">
      <h1 id="appTitle">جسر المعاتيق</h1>
      <p id="appTag"></p>
      <div class="who" id="who"></div>
    </div>
    <a class="logo-tile hide" id="logoL" target="_blank" rel="noopener"><img id="logoLimg" alt=""></a>
  </div>
</header>
<div class="trial hide" id="trialBar">المنصة في وضع التجربة — المعروضات الحالية للاختبار فقط</div>
<div class="banner hide" id="annBar"><div class="wrap" id="annText"></div></div>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
/* =========================================================
   ⚙️ الإعدادات — هذا هو المكان الوحيد الذي تحتاج تعديله
   ========================================================= */
const CONFIG = {
  // ١) قاعدة البيانات: من لوحة Supabase ← Project Settings ← API
  SUPABASE_URL: 'https://ckounswwbsfbvtwczoqn.supabase.co',
  SUPABASE_KEY: 'sb_publishable_5reApMleeJ9PPRSdmAD0MQ_kNlNuECa',

  // ٢) الهوية
  APP_NAME:  'جسر المعاتيق',
  TAGLINE:   'تداول أغراض عائلة المعاتيق: إهداءً أو إعارة',
  ORG_NAME:  '',                 // اسم الجهة المشغّلة (اختياري) مثال: 'جمعية ... للتنمية الاجتماعية'
  ORG_URL:   '',                 // موقع الجهة (اختياري)
  LOGO:      'logo.webp',         // شعار المنصة (أعلى اليمين)
  ORG_LOGO:  '',                 // شعار الجهة (أعلى اليسار، اختياري) مثال: 'org-logo.png'

  // ٣) رابط المنصة بعد النشر (يُستخدم في روابط الحجز داخل رسائل الواتساب)
  SITE_URL:  'https://almaateeq.com/maateeq',                 // مثال: 'https://jisr.example.org' — اتركه فارغاً ليُؤخذ من رابط الصفحة تلقائياً

  // ٤) نص صفحة «التعليمات» — فقرة التعريف
  ABOUT: 'منصة خاصة بعائلة المعاتيق لتداول الأغراض بينهم إهداءً أو إعارة: من عنده غرض زائد يعرضه، ومن يحتاجه يحجزه بكوده، ولا يدخلها إلا من عنده الرمز العائلي.',

  // ٥) الرمز العائلي السري: لا تفتح المنصة إلا به
  FAMILY_CODE: '1400',
};
const SUPABASE_URL = CONFIG.SUPABASE_URL, SUPABASE_KEY = CONFIG.SUPABASE_KEY;
const ORG_LINE = CONFIG.ORG_NAME ? `مبادرة من ${CONFIG.ORG_NAME} — ${CONFIG.TAGLINE}` : CONFIG.TAGLINE;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false}});

/* القوائم — يمكن تعديلها هنا مباشرة */
const CATEGORIES = ['أثاث منزلي ومكتبي','ملابس وأقمشة','أجهزة كهربائية وإلكترونية ورياضية','مستلزمات أطفال ومواليد','أواني وأدوات مطبخ','أحذية','مفارش وسجاد وستائر','عبايات ومستلزمات صلاة','مواد غذائية وحليب أطفال','حقائب وشنط','ألعاب أطفال','ديكور وتحف وإكسسوارات وأدوات متنوعة','مستلزمات طبية وكبار السن','كتب ومستلزمات دينية','أخرى ومتنوعات'];
const AREAS = ['الكويت','الربيعية','تاروت','سنابس','دارين','القطيف','سيهات','صفوى','أم الساهك','عنك','الجش','العوامية','القديح','أم الحمام','الآجام','الدمام','أخرى'];
const CONDITIONS = ['جديد','شبه جديد','مستعمل بحالة جيدة','يحتاج إصلاحاً بسيطاً'];
const PICKUP = ['الاستلام من بيت المتبرع','مكان يُتفق عليه','النقل على المستلم'];
const STATUS = {pending:['بانتظار الاعتماد','gold'],approved:['متاح','green'],booked:['محجوز','blue'],delivered:['تم التسليم','green'],cancelled:['أُلغي','gray'],expired:['انتهت مدته','gray'],rejected:['مرفوض','red']};

/* ---------- الحالة العامة ---------- */
const S = {token: localStorage.getItem('mtq2_token'), user: null, settings: {}, tab: 'today', adminTab: 'pending', items: []};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = $('#view');

function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?4500:3000); }
async function rpc(fn, args={}){
  const {data, error} = await sb.rpc(fn, args);
  if (error){
    const m = error.message || 'حدث خطأ غير متوقع';
    if (/انتهت الجلسة/.test(m)) { logout(true); }
    throw new Error(m);
  }
  return data;
}
const wa = p => { const d = String(p||'').replace(/\D/g,''); return 'https://wa.me/' + (/^[569]\d{7}$/.test(d) ? '965' + d : '966' + d.replace(/^0/,'')); };  // الكويتي 8 أرقام، والسعودي 05xxxxxxxx
const fmtDate = d => d ? new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
function left(d){ if(!d) return ''; const ms=new Date(d)-Date.now(); if(ms<=0) return 'انتهى'; const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4); return h? `باقي ${h} س ${m} د` : `باقي ${m} دقيقة`; }
const stPill = s => { const [t,c]=STATUS[s]||[s,'gray']; return `<span class="pill ${c==='green'?'':c}">${t}</span>`; };
const ico = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  offer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14 7v12" stroke-dasharray="2 2"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>',
  admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
};

/* ---------- التنقل ---------- */
function renderTabs(){
  const tabs = [['today','عرض اليوم'],['offer','اعرض غرضًا'],['book','احجز بالكود'],['me','حسابي'],['help','التعليمات']];
  if (S.user?.is_admin) tabs.push(['admin','الإدارة']);
  $('#tabs').innerHTML = tabs.map(([k,t])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">${ico[k]}<span>${t}</span></button>`).join('');
  $('#who').innerHTML = S.user ? `<span>أهلاً ${esc(S.user.name)}</span><button id="lo">خروج</button>` : `<button id="li">دخول</button>`;
  $('#lo')?.addEventListener('click', ()=>logout());
  $('#li')?.addEventListener('click', ()=>go('me'));
  $('#trialBar').classList.toggle('hide', !S.settings.trial_mode);
  const ann = (S.settings.announcement||'').trim();
  $('#annBar').classList.toggle('hide', !ann); $('#annText').textContent = ann;
}
$('#tabs').addEventListener('click', e => { const b=e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });
function go(tab){ S.tab=tab; location.hash=tab; renderTabs(); window.scrollTo(0,0); ({today:showToday,offer:showOffer,book:showBook,me:showMe,help:showHelp,admin:showAdmin})[tab](); }
function logout(silent){ if(S.token) rpc('jisr_logout',{p_token:S.token}).catch(()=>{}); S.token=null; S.user=null; localStorage.removeItem('mtq2_token'); if(!silent) toast('تم تسجيل الخروج'); renderTabs(); if(S.tab==='admin') go('today'); }

/* ---------- الدخول ---------- */
function loginBox(after, title='سجّل دخولك للمتابعة'){
  view.innerHTML = `
  <h2 class="sec">${title}</h2>

function compress(file, max=1280, q=0.78){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ let {width:w,height:h}=img; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>b?res(b):rej(new Error('تعذّر تجهيز الصورة')),'image/jpeg',q); };
    img.onerror=()=>rej(new Error('صيغة الصورة غير مدعومة')); img.src=URL.createObjectURL(file); });
}

function reqPill(k){
  if(k.req_status==='won') return k.item_status==='delivered'?'<span class="pill">تم الاستلام</span>':'<span class="pill blue">محجوز لك</span>';
  return {waiting:'<span class="pill gold">بانتظار الاختيار</span>',lost:'<span class="pill gray">لم يُختر</span>',released:'<span class="pill red">أُلغي لعدم الاستلام</span>',withdrawn:'<span class="pill gray">سحبت الطلب</span>'}[k.req_status]||'';
}

        </div>
        <div class="two"><div class="card"><b>حسب التصنيف</b><div style="margin-top:10px">${bars(r.by_category)}</div></div>
          <div class="card"><b>حسب المنطقة</b><div style="margin-top:10px">${bars(r.by_area)}</div></div></div>
        <div class="card" style="margin-top:14px"><b>المستفيدون حسب البلدة</b><div style="margin-top:10px">${bars(r.by_ben_town||[])}</div></div>
        <div class="card" style="margin-top:14px"><b>حسب اليوم</b><div style="margin-top:10px">${bars((r.by_day||[]).slice(-31).map(x=>({k:x.k,n:x.n})))}</div></div>`;
    }catch(e){ $('#sr').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }

/* ---------- رسائل الواتساب والصور ---------- */
const SITE = (CONFIG.SITE_URL || (location.origin + location.pathname)).replace(/\/(index\.html)?$/, '');
const bookLink = code => `${SITE}/#b=${code}`;
function t12(s){ if(!s) return ''; let [h,m]=String(s).split(':').map(Number); if(isNaN(h)) return s; const pm=h>=12; h=h%12||12; return `${h}:${String(m||0).padStart(2,'0')} ${pm?'مساءً':'صباحاً'}`; }
const pickupTime = i => (i.pickup_from||i.pickup_to) ? `من ${t12(i.pickup_from)} إلى ${t12(i.pickup_to)}` : 'يُتفق عليه مع العارض';
const place = i => [i.area, i.neighborhood].filter(Boolean).join(' - ');

/* القوالب — عدّل النصوص هنا متى شئت */
function msgAnnounce(i){
  const ph = S.settings.pickup_hours || 24;
  return [
`⬅️ ${i.code}`,
`⬆️ كود العرض`,
``,
`📍 ${i.title}${i.details ? '\n' + i.details : ''}`,
``,
`💫 الحالة: ${i.condition || '—'}`,
`📸 النوع موضح بالصورة`,
``,
`🚫 يمنع الاتصال بأي شكل 📞`,
`التواصل واتساب فقط`,
``,
`🚗 ${i.pickup_method || 'الاستلام على المستفيد'} من:`,
`*${place(i) || '—'}*`,
`⏰ وقت الاستلام: ${pickupTime(i)}`,
``,
`⛔ الحجز يلغى بعد ${ph} ساعة إذا لم يتم الاستلام`,
``,
`🔗 رابط الحجز: ${bookLink(i.code)}`,
...(S.settings.whatsapp_link ? [``, `${S.settings.whatsapp_name || ''}`, S.settings.whatsapp_link] : [])
  ].join('\n');
}
const msgBookedGroup = i => `✅ تم الحجز ${i.code}\n${i.title}\n\nجزى الله المتبرع خيراً 🌿`;
function msgBeneficiary(i){
  const ph = S.settings.pickup_hours || 24;
  return [
`السلام عليكم، من منصة ${CONFIG.APP_NAME} ✅`,
``,
`حُجز الغرض لك، وتأكد الحجز:`,
`الغرض: ${i.title} (${i.code})`,
`المنطقة: ${place(i) || '—'}`,
`طريقة الاستلام: ${i.pickup_method || '—'}`,
`وقت الاستلام: ${pickupTime(i)}`,
``,
`للتواصل مع العارض: ${i.donor_name || ''}`,
`${wa(i.donor_phone)}`,
``,
`يُرجى المبادرة بالتنسيق مع العارض واستلام الغرض خلال ${ph} ساعة، وإلا انتقل الحجز لغيرك.`,
`التواصل كتابي عبر الواتساب فقط، ولا يُدفع أي مقابل.`,
``,
`بعد الاستلام أكّد من «حسابي»: ${SITE}/#me`
  ].join('\n');
}
function msgDonor(i){
  const ph = S.settings.pickup_hours || 24;
  return [
`السلام عليكم، من منصة ${CONFIG.APP_NAME} 🌿`,
``,
`تم حجز غرضك: ${i.title} (${i.code})`,
`المستفيد: ${i.booker_name || ''}${i.booker_town ? ' — ' + i.booker_town : ''}`,
`للتواصل: ${wa(i.booker_phone)}`,
``,
`سيتواصل معك المستفيد كتابياً لتنسيق الاستلام خلال ${ph} ساعة.`,
`بعد التسليم أكّد من «حسابي»: ${SITE}/#me`,
``,
`جزاك الله خيراً على عطائك.`
  ].join('\n');
}

async function loadImg(url){
  const r = await fetch(url, {mode:'cors'}); if(!r.ok) throw new Error('img');
  const u = URL.createObjectURL(await r.blob());
  const img = new Image(); img.src = u; await img.decode(); return img;
}
async function itemCanvas(i, stamped){
  try{ await document.fonts.load('800 80px Tajawal'); }catch(e){}
  let img = null;
  if (i.photos && i.photos[0]) { try{ img = await loadImg(i.photos[0]); }catch(e){ img = null; } }
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  if (img){ const k = Math.min(1, 1280/Math.max(img.width,img.height)); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); x.drawImage(img,0,0,c.width,c.height); }
  else {
    c.width=1080; c.height=810; const g=x.createLinearGradient(0,0,1080,810); g.addColorStop(0,'#173a2b'); g.addColorStop(1,'#3a7a5c'); x.fillStyle=g; x.fillRect(0,0,1080,810);
    x.fillStyle='#fff'; x.textAlign='center'; x.direction='rtl'; x.font='800 64px Tajawal, sans-serif'; x.fillText(i.title.slice(0,40),540,360);
    x.font='700 40px Tajawal, sans-serif'; x.fillStyle='#f7ecd8'; x.fillText(CONFIG.ORG_NAME ? `${CONFIG.APP_NAME} — ${CONFIG.ORG_NAME}`.slice(0,48) : CONFIG.APP_NAME,540,450);
    x.font='800 72px monospace'; x.fillStyle='#fff'; x.direction='ltr'; x.fillText(i.code,540,580);
  }
  if (stamped){
    const W=c.width, H=c.height, s=Math.min(W,H);
    x.save(); x.translate(W/2,H/2); x.rotate(-14*Math.PI/180);
    const w=s*0.78, h=s*0.3, r=h/2;
    const rr=(pad,fill)=>{ x.beginPath(); x.roundRect(-w/2-pad,-h/2-pad,w+pad*2,h+pad*2,r+pad); x.fillStyle=fill; x.fill(); };
    x.shadowColor='rgba(0,0,0,.3)'; x.shadowBlur=s*0.03; rr(s*0.02,'#c62f25'); x.shadowBlur=0;
    rr(s*0.008,'#ffffff'); rr(0,'#c62f25');
    x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl';
    x.font=`800 ${Math.round(h*0.52)}px Tajawal, sans-serif`; x.fillText('تم الحجز',0,h*0.04);
    x.restore();
    const bh=Math.round(s*0.09); x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,H-bh,W,bh);
    x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.direction='ltr'; x.font=`700 ${Math.round(bh*0.5)}px Tajawal, sans-serif`;
    x.fillText(`${i.code}  ✅`, W/2, H-bh/2);
  }
  return c;
}
const canvasFile = (c,name) => new Promise(res=>c.toBlob(b=>res(new File([b], name, {type:'image/jpeg'})),'image/jpeg',0.85));
async function itemPhotoFiles(i){
  const out=[];
  for (const [n,u] of (i.photos||[]).entries()){ try{ const r=await fetch(u,{mode:'cors'}); const b=await r.blob(); out.push(new File([b], `${i.code}-${n+1}.jpg`, {type:b.type||'image/jpeg'})); }catch(e){} }
  if (!out.length) out.push(await canvasFile(await itemCanvas(i,false), `${i.code}.jpg`));
  return out;
}
function dl(file){ const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; } }
async function shareToWA(files, text){
  await copyText(text);
  if (files.length && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, text}); toast('النص منسوخ أيضاً — الصقه تحت الصورة إن لم يظهر'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  files.forEach(dl);
  toast('نُزّلت الصورة ونُسخ النص — أرسلهما في مجموعة الواتساب');
}

/* لوحة رسائل الواتساب للمشرف */
async function waPanel(i, kind){
  if (!i) return;
  const m=document.createElement('div'); m.className='modal';
  const sec = (id,title,text,btns) => `<div class="card" style="margin-bottom:12px"><b>${title}</b>
      <div id="img_${id}" style="margin-top:10px"></div>
      <textarea class="prev" id="tx_${id}" style="margin-top:8px">${esc(text)}</textarea>
      <div class="row" style="margin-top:8px">${btns}</div></div>`;
  let body='';
  if (kind==='announce'){
    body = sec('g','إعلان العرض في مجموعة الواتساب', msgAnnounce(i),
      `<button class="btn wa" data-go="share_g">مشاركة في الواتساب (الصورة + النص)</button><button class="btn sm sec" data-go="copy_g">نسخ النص</button><button class="btn sm sec" data-go="dl_g">تحميل الصورة</button>`);
  } else {
    body = sec('g','١) إعلان «تم الحجز» في المجموعة', msgBookedGroup(i),
        `<button class="btn wa" data-go="share_g">مشاركة الصورة المختومة</button><button class="btn sm sec" data-go="copy_g">نسخ النص</button><button class="btn sm sec" data-go="dl_g">تحميل الصورة</button>`)
      + sec('b',`٢) رسالة للمستفيد: ${esc(i.booker_name||'')} ${i.booker_town?'('+esc(i.booker_town)+')':''}`, msgBeneficiary(i),
        `<button class="btn wa" data-go="send_b">إرسال للمستفيد عبر الواتساب</button><button class="btn sm sec" data-go="copy_b">نسخ</button>`)
      + sec('d',`٣) رسالة للعارض: ${esc(i.donor_name||'')}`, msgDonor(i),
        `<button class="btn wa" data-go="send_d">إرسال للعارض عبر الواتساب</button><button class="btn sm sec" data-go="copy_d">نسخ</button>`);
  }
  m.innerHTML = `<div class="box"><div class="row"><h2 class="sec" style="margin:0">رسائل الواتساب — ${esc(i.code)}</h2><span class="sp"></span><button class="btn sm sec" data-go="close">إغلاق</button></div>
    <p class="sub" style="margin:4px 0 12px">يمكنك تعديل النص قبل الإرسال. الإرسال يتم من واتساب جوالك.</p>${body}</div>`;
  document.body.appendChild(m);
  m.onclick = e => { if(e.target===m) m.remove(); };
  // تجهيز الصورة
  let gFiles = null;
  const ready = (async()=>{
    const box=$('#img_g',m);
    box.innerHTML='<div class="spin" style="margin:10px auto"></div>';
    try{
      gFiles = kind==='announce' ? await itemPhotoFiles(i) : [await canvasFile(await itemCanvas(i,true), `${i.code}-تم-الحجز.jpg`)];
      box.innerHTML = `<img class="previmg" src="${URL.createObjectURL(gFiles[0])}" alt="">${gFiles.length>1?`<div class="meta" style="justify-content:center">+ ${gFiles.length-1} صورة أخرى</div>`:''}`;
    }catch(e){ box.innerHTML='<div class="meta">تعذّر تجهيز الصورة</div>'; gFiles=[]; }
  })();
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=async()=>{
    const [a,id]=b.dataset.go.split('_'); const tx=id?$('#tx_'+id,m).value:'';
    if (a==='close') return m.remove();
    if (a==='copy'){ toast(await copyText(tx)?'تم نسخ النص':'تعذّر النسخ', false); return; }
    if (a==='dl'){ await ready; (gFiles||[]).forEach(dl); return; }
    if (a==='share'){ await ready; await shareToWA(gFiles||[], tx); return; }
    if (a==='send'){ const ph = id==='b'? i.booker_phone : i.donor_phone; window.open(`${wa(ph)}?text=${encodeURIComponent(tx)}`,'_blank'); }
  });
}

/* ملف المستخدم: البلدة مطلوبة */
function profileModal(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h2 class="sec">أكمل بياناتك</h2><p class="sub">أضف البلدة التي تسكن فيها لإكمال حسابك.</p>
    <label class="f"><span>الاسم</span><input type="text" id="pn" maxlength="60" value="${esc(S.user.name||'')}"></label>
    <label class="f"><span>البلدة</span><select id="pt2"><option value="">اختر البلدة</option>${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></label>
    <button class="btn block" id="ps">حفظ</button></div>`;
  document.body.appendChild(m);
  $('#ps',m).onclick=async()=>{ try{ await rpc('jisr_update_profile',{p_token:S.token,p_name:$('#pn',m).value,p_town:$('#pt2',m).value}); S.user.name=$('#pn',m).value; S.user.town=$('#pt2',m).value; m.remove(); renderTabs(); toast('تم الحفظ'); }catch(e){ toast(e.message,true); } };
}

function applyBrand(){

  $('#appTitle').textContent = CONFIG.APP_NAME; $('#appTag').textContent = ORG_LINE;
  $('#logoRimg').src = CONFIG.LOGO; $('#logoRimg').alt = 'شعار ' + CONFIG.APP_NAME; $('#logoR').title = CONFIG.APP_NAME;
  if (CONFIG.ORG_LOGO){ $('#logoL').classList.remove('hide'); $('#logoLimg').src = CONFIG.ORG_LOGO; $('#logoLimg').alt = 'شعار ' + (CONFIG.ORG_NAME||''); if (CONFIG.ORG_URL) $('#logoL').href = CONFIG.ORG_URL; else $('#logoL').removeAttribute('href'); $('#logoL').title = CONFIG.ORG_NAME||''; }
}
(async function init(){
  applyBrand();
  if (/YOUR-/.test(SUPABASE_URL + SUPABASE_KEY)){
    view.innerHTML = `<div class="card" style="max-width:620px;margin:auto"><h2 class="sec">المنصة جاهزة للإعداد</h2>
      <p>لم يُربط الملف بقاعدة بيانات بعد. افتح <b>index.html</b> بمحرر نصوص، وفي قسم <b>CONFIG</b> بأعلى البرمجة ضع عنوان مشروع Supabase ومفتاحه العام، ثم احفظ الملف وأعد فتح الصفحة.</p>
      <p class="sub">التفاصيل خطوة بخطوة في ملف «دليل التشغيل».</p></div>`;
    $('#tabs').innerHTML=''; return;
  }
  let famOk=false; try{ famOk = localStorage.getItem('mtq2_family') === CONFIG.FAMILY_CODE; }catch(e){}
  if (!famOk){
    $('#tabs').innerHTML='';
    view.innerHTML = `<div class="card" style="max-width:420px;margin:24px auto;text-align:center"><h2 class="sec" style="margin-top:0">منصة عائلة المعاتيق</h2>
      <p class="sub">اكتب الرمز العائلي للدخول</p>
      <input type="password" id="fam" inputmode="numeric" maxlength="12" style="text-align:center;font-size:22px;letter-spacing:6px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--g2)">
      <button class="btn block" id="famGo" style="margin-top:12px">دخول</button></div>`;
    const tryFam=()=>{ if ($('#fam').value.trim() === CONFIG.FAMILY_CODE){ try{ localStorage.setItem('mtq2_family', CONFIG.FAMILY_CODE); }catch(e){} location.reload(); } else toast('الرمز العائلي غير صحيح', true); };
    $('#famGo').onclick=tryFam; $('#fam').onkeydown=e=>{ if(e.key==='Enter') tryFam(); }; return;
  }
  await loadSettings();
  if (S.token){ try{ S.user = await rpc('jisr_me',{p_token:S.token}); }catch(e){ S.token=null; localStorage.removeItem('mtq2_token'); } }
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('b=')) { S.pendingCode = h.slice(2).toUpperCase(); go('book'); }
  else go(['today','offer','book','me','help','admin'].includes(h) ? h : 'today');
  if (S.user && !S.user.town) profileModal();
  window.addEventListener('hashchange', ()=>{ const x=decodeURIComponent(location.hash.slice(1)); if(x.startsWith('b=')){ S.pendingCode=x.slice(2).toUpperCase(); go('book'); } });
  setInterval(()=>{ if(S.tab==='today' && $('#items .grid')) drawItems(); }, 60000);
})();
</script>
