<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#173a2b">
<title>السهل الممتنع — قارئ PDF</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a2 2 0 0 0 2 2h13.5a2 2 0 0 0 1.9-1.4L22 12H7.4a2 2 0 0 0-1.9 1.4L3 20"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M14 4v16"/><path d="M16.5 8h1.5M16.5 11h1.5M16.5 14h1.5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V5a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 11.5V6.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6 7-2.6 0-4-1.3-5.6-3.6L3.6 15a1.5 1.5 0 0 1 2.3-1.9L8 15"/></symbol>
    <symbol id="i-marker" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L11 18H6v-5z"/><path d="M4 21h9"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></symbol>
    <symbol id="i-shapes" viewBox="0 0 24 24"><rect x="3.5" y="11.5" width="9" height="9" rx="1"/><circle cx="16.5" cy="8" r="4.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/><path d="M8.5 9h7M8.5 12.5h4"/></symbol>
    <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M9 3h6l-1 7h3a2 2 0 0 1 2 2v3H5v-3a2 2 0 0 1 2-2h3z"/><path d="M5 19h14"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.6 14.6l9.2-9.2a2 2 0 0 1 2.8 0l2.9 2.9a2 2 0 0 1 0 2.8L12.3 18.3a5.5 5.5 0 0 1-7.7 0 2 2 0 0 1 0-3.7z"/><path d="M9 10l5 5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M15 7H8.5L12 3.5"/><path d="M8.5 7A7 7 0 1 1 6 16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.7 10.8l6.6-4M8.7 13.2l6.6 4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M20.5 16l-5-5-9 8.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 3.5h11V21L12 16.5 6.5 21z"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 4h4M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
  </defs>
</svg>

<!-- الافتتاحية -->
<div id="splash" aria-hidden="true">
  <div class="splash-stage">
    <div class="splash-page">
      <i class="sp-line"></i><i class="sp-line"></i><i class="sp-line"></i><i class="sp-line s"></i>
      <i class="sp-scan"></i>
    </div>
    <h1 class="splash-title">السهل الممتنع</h1>
    <p class="splash-sub">اقرأ ملفاتك وعلّق عليها</p>
  </div>
</div>


<!-- الرئيسية -->
<main id="home" class="screen">
  <header class="home-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg><use href="#i-file"/></svg></span>
      <div>
        <h1>السهل الممتنع</h1>
        <p>اقرأ ملفاتك وعلّق عليها، بلا إنترنت</p>
      </div>
    </div>
    <button class="icon-btn" id="btnSound" aria-label="الصوت"><svg><use href="#i-sound"/></svg></button>
  </header>

  <section class="hero">
    <div class="hero-card">
      <button class="btn-primary big" id="btnOpen"><svg><use href="#i-open"/></svg><span>افتح ملف PDF</span></button>
      <p class="hero-hint">أو افتح أي ملف PDF من مدير الملفات أو واتساب، واختر «السهل الممتنع»</p>
    </div>
  </section>

  <section class="recent">
    <h2>آخر الملفات</h2>
    <div id="recentList" class="recent-list"></div>
    <div id="recentEmpty" class="empty" hidden>
      <svg><use href="#i-file"/></svg>
      <p>لم تفتح ملفًا بعد. اضغط «افتح ملف PDF» لتبدأ.</p>
    </div>
  </section>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
</main>

<!-- القارئ -->
<main id="reader" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="الرئيسية"><svg><use href="#i-back"/></svg></button>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon-btn" id="btnAddTab" aria-label="افتح ملفًا آخر"><svg><use href="#i-plus"/></svg></button>
    <button class="icon-btn" id="btnSearch" aria-label="البحث"><svg><use href="#i-search"/></svg></button>
    <button class="icon-btn" id="btnPanel" aria-label="الفهرس والصفحات"><svg><use href="#i-panel"/></svg></button>
    <button class="icon-btn" id="btnMore" aria-label="المزيد"><svg><use href="#i-more"/></svg></button>
    <i class="topbar-laser" aria-hidden="true"></i>
  </header>

  <div class="searchbar" id="searchbar" hidden>
    <input id="searchInput" type="search" placeholder="ابحث في الملف…" enterkeyhint="search" autocomplete="off">
    <span class="search-count" id="searchCount"></span>
    <button class="icon-btn sm" id="searchPrev" aria-label="السابق"><svg><use href="#i-up"/></svg></button>
    <button class="icon-btn sm" id="searchNext" aria-label="التالي"><svg><use href="#i-down"/></svg></button>
    <button class="icon-btn sm" id="searchClose" aria-label="إغلاق البحث"><svg><use href="#i-close"/></svg></button>
  </div>

  <div class="viewer" id="viewer" dir="ltr">
    <div class="pages" id="pages"></div>
  </div>

  <div class="loading" id="loading" hidden><i class="spinner"></i><span id="loadingText">يُفتح الملف…</span></div>

  <div class="float-left">
    <div class="zoom">
      <button class="icon-btn sm" id="zoomOut" aria-label="تصغير"><svg><use href="#i-minus"/></svg></button>
      <button class="zoom-val" id="zoomVal">100%</button>
      <button class="icon-btn sm" id="zoomIn" aria-label="تكبير"><svg><use href="#i-plus"/></svg></button>
    </div>
  </div>
  <button class="page-chip" id="pageChip"><span id="pageNow">1</span> / <span id="pageTotal">1</span></button>

  <div class="toolhint" id="toolhint" hidden></div>

  <nav class="toolbar" id="toolbar">
    <button class="tool active" data-tool="hand"><svg><use href="#i-hand"/></svg><span>قراءة</span></button>
    <button class="tool" data-tool="marker"><svg><use href="#i-marker"/></svg><span>تظليل</span></button>
    <button class="tool" data-tool="pen"><svg><use href="#i-pen"/></svg><span>قلم</span></button>
    <button class="tool" data-tool="shape"><svg><use href="#i-shapes"/></svg><span>أشكال</span></button>
    <button class="tool" data-tool="text"><svg><use href="#i-text"/></svg><span>نص</span></button>
    <button class="tool" data-tool="note"><svg><use href="#i-note"/></svg><span>ملاحظة</span></button>
    <button class="tool" data-tool="stamp"><svg><use href="#i-stamp"/></svg><span>ختم</span></button>
    <button class="tool" data-tool="eraser"><svg><use href="#i-eraser"/></svg><span>ممحاة</span></button>
    <button class="tool" id="btnUndo"><svg><use href="#i-undo"/></svg><span>تراجع</span></button>
  </nav>

  <div class="colorbar" id="colorbar" hidden></div>

  <div class="sel-pop" id="selPop" hidden>
    <button data-act="hl"><i class="sw" style="background:#f3d36b"></i>ظلّل</button>
    <button data-act="ul">سطّر</button>
    <button data-act="st">اشطب</button>
    <button data-act="copy"><svg><use href="#i-copy"/></svg>انسخ</button>
  </div>
</main>

<!-- اللوحة الجانبية -->
<aside class="panel" id="panel" hidden>
  <div class="panel-head">
    <div class="seg" id="panelTabs">
      <button data-p="outline" class="on">الفهرس</button>
      <button data-p="thumbs">الصفحات</button>
      <button data-p="marks">العلامات</button>
      <button data-p="annots">التعليقات</button>
    </div>
    <button class="icon-btn sm" id="panelClose" aria-label="إغلاق"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<!-- قائمة المزيد -->
<div class="menu" id="menu" hidden>
  <button data-m="bookmark"><svg><use href="#i-bookmark"/></svg><span id="mBookmark">ضع علامة على هذه الصفحة</span></button>
  <button data-m="goto"><svg><use href="#i-fit"/></svg><span>اذهب إلى صفحة</span></button>
  <button data-m="fit"><svg><use href="#i-fit"/></svg><span>ملاءمة العرض</span></button>
  <button data-m="mode"><svg><use href="#i-moon"/></svg><span id="mMode">الوضع: عادي</span></button>
  <hr>
  <button data-m="save"><svg><use href="#i-save"/></svg><span>احفظ نسخة بالتعليقات</span></button>
  <button data-m="share"><svg><use href="#i-share"/></svg><span>شارك الملف بالتعليقات</span></button>
  <button data-m="img"><svg><use href="#i-image"/></svg><span>صدّر هذه الصفحة صورة</span></button>
  <hr>
  <button data-m="props"><svg><use href="#i-info"/></svg><span>خصائص الملف</span></button>
</div>

<!-- نافذة عامة -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="dlg-actions" id="dlgActions"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="lib/pdf-lib.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
