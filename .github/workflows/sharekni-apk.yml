name: جسر العطاء (شاركني) — بناء APK
on:
  push:
    branches: [main]
    paths:
      - 'android/sharekni/**'
      - '.github/workflows/sharekni-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        working-directory: android/sharekni
        run: |
          mkdir -p app/src/main/assets
          cp offline/offline.html app/src/main/assets/
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/jisr-sharekni.apk
      - uses: actions/upload-artifact@v4
        with: { name: jisr-sharekni, path: out/ }
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sharekni-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create sharekni-latest out/jisr-sharekni.apk --title "جسر العطاء (شاركني) — أحدث نسخة" \
            --notes "تطبيق أندرويد يفتح منصة jisr.sharekni.org.sa كما هي، فيظهر آخر تحديث دائمًا." --latest=false
