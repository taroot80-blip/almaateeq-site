plugins { id 'com.android.application' }

android {
    namespace 'com.almaateeq.hawza'
    compileSdk 36
    defaultConfig {
        applicationId 'com.almaateeq.hawzauniversity'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        // مفتاح ثابت لنسخ التجربة، حتى يُثبَّت كل تحديث فوق سابقه.
        test {
            storeFile rootProject.file('hawza-test.keystore')
            storePassword 'hawza-test'
            keyAlias 'hawzatest'
            keyPassword 'hawza-test'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
        release { minifyEnabled false; signingConfig signingConfigs.test }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
