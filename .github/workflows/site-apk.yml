name: موقع المعاتيق — بناء APK
on:
  push:
    branches: [main]
    paths:
      - 'android/site/**'
      - '.github/workflows/site-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        working-directory: android/site
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/almaateeq.apk
      - uses: actions/upload-artifact@v4
        with: { name: almaateeq-site, path: out/ }
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete site-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create site-latest out/almaateeq.apk --title "موقع المعاتيق — أحدث نسخة" \
            --notes "تطبيق أندرويد لموقع المعاتيق، يفتح دائمًا آخر تحديث من almaateeq.com." --latest=false
