name: مسابقة رحلة الجبيل — بناء APK
on:
  push:
    branches: [main]
    paths:
      - 'apps/jubail/**'
      - 'android/jubail/**'
      - '.github/workflows/jubail-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        working-directory: android/jubail
        run: |
          mkdir -p app/src/main/assets
          cp ../../apps/jubail/index.html app/src/main/assets/index.html
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/jubail-1448.apk
      - uses: actions/upload-artifact@v4
        with: { name: jubail-1448, path: out/ }
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jubail-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create jubail-latest out/jubail-1448.apk --title "مسابقة رحلة الجبيل — أحدث نسخة" \
            --notes "تطبيق أندرويد لمسابقة رحلة الجبيل المعاتيقية السنوية 1448هـ: يفتح نسخة الموقع مع الإنترنت، والنسخة المدمجة بلا إنترنت." --latest=false
