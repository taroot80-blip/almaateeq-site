<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لا يوجد اتصال</title>
<style>
:root{--gold:#F2B632;--ink:#1a120b;--fg:#f6ead4;--mute:#cdb995}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg);
  font-family:"Noto Naskh Arabic","Tajawal",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 20%,rgba(242,182,50,.16),transparent 60%),linear-gradient(170deg,#0b0805,#2a1d12 55%,#1a120b);overflow:hidden}
.box{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:30ch;animation:up .7s cubic-bezier(.23,1,.32,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.96)}}
.orb{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:3px solid var(--gold);box-shadow:0 0 30px rgba(242,182,50,.35),inset 0 0 24px rgba(242,182,50,.2);animation:pulse 2.4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(242,182,50,.35);animation:ring 2.4s ease-out infinite}
@keyframes pulse{50%{box-shadow:0 0 50px rgba(242,182,50,.6),inset 0 0 30px rgba(242,182,50,.3)}}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.orb svg{width:56px;height:56px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round}
h1{margin:0;font-size:26px;color:var(--gold)}
p{margin:0;color:var(--mute);line-height:1.9;font-size:17px}
button{min-height:54px;padding:0 30px;border:0;border-radius:16px;font:inherit;font-size:19px;font-weight:700;
  background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #a87a15,0 10px 26px rgba(242,182,50,.3);cursor:pointer;position:relative;overflow:hidden}
button::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,50%{left:-60%}100%{left:130%}}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #a87a15}
</style>
</head>
<body>
<div class="box">
  <div class="orb"><svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M3 3l18 18"/><circle cx="12" cy="19" r="1" fill="#F2B632"/></svg></div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يعرض التطبيق أحدث نسخة من الموقع عند الاتصال. صِل جهازك بالإنترنت ثم اضغط الزر.</p>
  <button onclick="try{AndroidApp.retry()}catch(e){location.href='https://almaateeq-site.vercel.app/'}">أعد المحاولة</button>
</div>
</body>
</html>
